name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Aceptar licencias del SDK de Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Compilar APK (debug)
        run: gradle assembleDebug --stacktrace

      - name: Renombrar el APK
        run: cp app/build/outputs/apk/debug/app-debug.apk paisanu-jabali.apk

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: paisanu-jabali-apk
          path: paisanu-jabali.apk

      - name: Publicar APK en una release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Paisanu Jabalí v${{ github.run_number }}
          body: APK de depuración. Descárgalo desde el móvil e instálalo.
          files: paisanu-jabali.apk
